name: generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: draw assets/contrib3d-light.svg and assets/contrib3d-dark.svg
        run: python3 scripts/contrib3d.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit and push the updated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib3d-light.svg assets/contrib3d-dark.svg
          if git commit -m "update 3D contribution graph"; then
            git push
          fi
